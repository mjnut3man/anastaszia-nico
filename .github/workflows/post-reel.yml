name: Instagram Reels Auto Post

on:
  schedule:
    # GitHub Actions cron is always UTC (no timezone support). Times below are
    # converted from America/Chicago assuming CDT (UTC-5). During CST (UTC-6,
    # ~Nov–Mar) these fire 1h earlier locally (10:30 AM / 6:30 PM); shift +1h to correct.
    - cron: '30 16 * * *'  # 11:30 AM Chicago (CDT, UTC-5)
    - cron: '30 0 * * *'   # 7:30 PM Chicago (CDT, UTC-5; 00:30 UTC next day)
  workflow_dispatch:        # allows manual run from GitHub website

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run reels poster
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python3 post_reel.py

      - name: Commit posted files back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels-to-post/ reels-posted/
          git diff --cached --quiet || git commit -m "auto: posted next reel [skip ci]"
          git push
